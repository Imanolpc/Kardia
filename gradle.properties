# Enable AndroidX mapping for modern libraries
android.useAndroidX=true
# Disable Jetifier to prevent it from crashing on modern Java 21 libraries
android.enableJetifier=false

# Allow KSP / Kotlin source sets with AGP
android.disallowKotlinSourceSets=false

# Allocate more memory to the Gradle daemon to prevent OutOfMemoryError (e.g. during D8 dex merging)
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
